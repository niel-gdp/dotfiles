# --- Basic defaults ---
set -g default-terminal "screen-256color"
set -g history-limit 10000

# --- VIM Style Copy Mode ---
set-window-option -g mode-keys vi
# Default copy-mode-vi binds v to rectangle-toggle and has no y binding at all;
# rebind to vim-like visual-select/yank (rectangle-toggle still reachable via C-v).
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

is_vim='echo "#{pane_current_command}" | grep -iqE "(^|/)g?(view|n?vim?x?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# --- Prefix key ---
unbind C-b                # Unbind the default prefix (Ctrl+b)
set -g prefix C-a         # Set prefix to Ctrl+a
bind C-a send-prefix      # Make Ctrl+a send the prefix when pressed twice

# --- Start window and pane numbering at 1 ---
set -g base-index 1       # Windows start numbering at 1
setw -g pane-base-index 1 # Panes start numbering at 1
set -g renumber-windows on # Renumber remaining windows sequentially when one is killed

# --- Mouse support ---
set -g mouse on

# --- Easier split bindings ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- Open new windows in the current pane's path ---
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Reload config easily ---
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# --- Fix Claude Code Shift+Enter feature ---
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# --- Theme (Catppuccin) ---
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_current_number_color '#{@thm_blue}'

# Strip the "enderman.gdplabs.net-" prefix from the kubectx context shown in status-right
set -gq "@catppuccin_kube_text" \
   " #{l:#[fg=#{@catppuccin_kube_context_color}]#($HOME/.tmux/plugins/tmux-kubectx/scripts/context.sh | sed 's/^enderman\.gdplabs\.net-//')#[fg=default]:#[fg=#{@catppuccin_kube_namespace_color}]#{kubectx_namespace}}"

set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_kube}"

# --- Plugin manager (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tony-sol/tmux-kubectx'

# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'
